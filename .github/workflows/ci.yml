name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly canary against the latest dsh prerelease: the harness is in developer
    # preview and its client/tool APIs move; this run fails early when they do.
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: pack (publish dry run)
        run: pnpm pack --pack-destination /tmp

  plugin-pages:
    name: native plugin pages (current published Harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: install current UI runtime in isolation
        run: |
          # Individual UI packages retain old latest tags; the dsh release
          # version identifies the matching published UI composition.
          harness_ui_version=$(npm view @deepseek-ai/dsh@latest version --registry=https://registry.npmjs.org)
          npm install --prefix "$RUNNER_TEMP/dsh-ui" --ignore-scripts --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org \
            @deepseek-ai/cordis@latest \
            "@deepseek-ai/dsh-client-ui-slots@$harness_ui_version" \
            "@deepseek-ai/dsh-client-ui-renderer@$harness_ui_version" \
            "@deepseek-ai/dsh-client-ui-plugin-manager@$harness_ui_version" \
            "@deepseek-ai/dsh-client-ui-layout@$harness_ui_version" \
            "@deepseek-ai/dsh-client-ui-sidebar@$harness_ui_version"
      - name: exercise native pages and fiber lifetimes
        run: DSH_COMPAT_ROOT="$RUNNER_TEMP/dsh-ui" pnpm exec vitest run tests/plugin-pages-current.test.ts

  canary:
    name: canary against dsh@next
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bump every @deepseek-ai/* dev dependency to the next tag
        run: |
          set -euo pipefail
          pkgs=$(node -e 'const p=require("./package.json");console.log(Object.keys(p.devDependencies).filter(k=>k.startsWith("@deepseek-ai/")).map(k=>k+"@next").join(" "))')
          # auto-install-peers off, or this step fails before it tests anything.
          # pnpm 10 turns it on by default: it installs a package's *optional*
          # peers too, and widens the range while doing it — dsh-subagent@next
          # asks for `dsh-sandbox@^0.1.1-rc.2`, pnpm resolves
          # `>=0.1.1 <0.2.0-0`, and only prereleases of 0.1.x are published, so
          # install dies with ERR_PNPM_NO_MATCHING_VERSION. That is an artifact
          # of a prerelease train, not the upstream drift this canary exists to
          # catch, and it had been reporting red since 2026-08-24 for that
          # reason alone.
          pnpm add -D $pkgs --config.auto-install-peers=false
      - run: pnpm run typecheck
      - run: pnpm test
